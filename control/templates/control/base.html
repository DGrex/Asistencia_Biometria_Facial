{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Control de Asistencia{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'control/css/style.css' %}">
</head>
<body>
    {% if user.is_authenticated %}
    <nav class="navbar navbar-expand mb-4">
        <div class="container">
            <span class="navbar-brand">Control de Asistencia</span>
            <div class="d-flex gap-1 align-items-center flex-wrap">
                <a class="nav-link-custom {% if request.resolver_match.url_name == 'dashboard' %}activo{% endif %}" href="{% url 'dashboard' %}">Inicio</a>
                <a class="nav-link-custom {% if request.resolver_match.url_name == 'lista_estudiantes' %}activo{% endif %}" href="{% url 'lista_estudiantes' %}">Estudiantes</a>
                <a class="nav-link-custom {% if request.resolver_match.url_name == 'tomar_asistencia' %}activo{% endif %}" href="{% url 'tomar_asistencia' %}">Tomar asistencia</a>
                <a class="nav-link-custom {% if request.resolver_match.url_name == 'historial' %}activo{% endif %}" href="{% url 'historial' %}">Historial</a>
                <a class="nav-link-custom" href="/admin/" target="_blank">Configuración</a>
                <a class="nav-link-custom text-danger" href="{% url 'logout' %}">Salir ({{ user.username }})</a>
            </div>
        </div>
    </nav>
    {% endif %}
    <main class="container pb-5">
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>

{% extends "control/base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="d-flex justify-content-center align-items-center" style="min-height:80vh;">
    <div class="card shadow-sm" style="max-width:380px; width:100%;">
        <div class="card-body p-4">
            <h4 class="mb-1 text-center">Control de Asistencia</h4>
            <p class="text-muted text-center small mb-4">Acceso exclusivo para docentes</p>
            {% if form.non_field_errors %}
                <div class="alert alert-danger py-2">{{ form.non_field_errors.0 }}</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
